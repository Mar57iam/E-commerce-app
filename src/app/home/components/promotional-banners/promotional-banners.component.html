<section class="mx-auto w-full max-w-[1240px] px-4 pb-8 sm:px-6 lg:pb-12" aria-label="Special offers">
  <div class="grid gap-5 lg:grid-cols-2">
    <article class="relative isolate flex min-h-[330px] flex-col items-start overflow-hidden rounded-3xl bg-gradient-to-br from-emerald-500 to-emerald-800 p-7 text-white sm:min-h-[360px] sm:p-9">
      <span class="pointer-events-none absolute -right-8 -top-20 -z-10 size-48 rounded-full bg-white/10" aria-hidden="true"></span>
      <span class="pointer-events-none absolute -bottom-20 -left-12 -z-10 size-36 rounded-full bg-white/10" aria-hidden="true"></span>

      <p class="mb-5 inline-flex items-center gap-2 rounded-full bg-white/20 px-4 py-2 text-sm font-semibold">
        <i class="fa-solid fa-tag" aria-hidden="true"></i>
        Wardrobe update
      </p>
      <h2 class="mb-2 text-3xl font-extrabold tracking-tight sm:text-4xl">Find your new favorite</h2>
      <p class="mb-5 text-base text-white/85 sm:text-lg">Get 40% off selected styles and everyday essentials.</p>
      <div class="mb-7 flex flex-wrap items-baseline gap-x-4 gap-y-1">
        <p class="text-4xl font-extrabold sm:text-5xl">40% OFF</p>
        <p class="text-sm text-white/85 sm:text-base">Use code: <strong class="text-white">STYLE40</strong></p>
      </div>
      <a
        class="mt-auto inline-flex items-center gap-3 rounded-full bg-white px-6 py-3 font-bold text-emerald-700 no-underline transition hover:bg-emerald-50"
        [routerLink]="shopLink"
      >
        Shop now
        <i class="fa-solid fa-arrow-right text-sm" aria-hidden="true"></i>
      </a>
    </article>

    <article class="relative isolate flex min-h-[330px] flex-col items-start overflow-hidden rounded-3xl bg-gradient-to-br from-orange-400 to-rose-500 p-7 text-white sm:min-h-[360px] sm:p-9">
      <span class="pointer-events-none absolute -right-8 -top-20 -z-10 size-48 rounded-full bg-white/10" aria-hidden="true"></span>
      <span class="pointer-events-none absolute -bottom-20 -left-12 -z-10 size-36 rounded-full bg-white/10" aria-hidden="true"></span>

      <p class="mb-5 inline-flex items-center gap-2 rounded-full bg-white/20 px-4 py-2 text-sm font-semibold">
        <i class="fa-solid fa-star" aria-hidden="true"></i>
        Everyday activewear
      </p>
      <h2 class="mb-2 text-3xl font-extrabold tracking-tight sm:text-4xl">Move in your own style</h2>
      <p class="mb-5 text-base text-white/85 sm:text-lg">Explore comfortable looks made to move with you.</p>
      <div class="mb-7 flex flex-wrap items-baseline gap-x-4 gap-y-1">
        <p class="text-4xl font-extrabold sm:text-5xl">25% OFF</p>
        <p class="text-sm text-white/85 sm:text-base">Use code: <strong class="text-white">MOVE25</strong></p>
      </div>
      <a
        class="mt-auto inline-flex items-center gap-3 rounded-full bg-white px-6 py-3 font-bold text-orange-600 no-underline transition hover:bg-orange-50"
        [routerLink]="shopLink"
      >
        Explore now
        <i class="fa-solid fa-arrow-right text-sm" aria-hidden="true"></i>
      </a>
    </article>
  </div>
</section>
