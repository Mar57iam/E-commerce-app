<div class="flex items-start gap-4">
  <span class="mt-1 h-10 w-1.5 shrink-0 rounded-full bg-primary" aria-hidden="true"></span>
  <div>
    @if (eyebrow()) {
      <p class="mb-1 text-xs font-bold uppercase tracking-[0.16em] text-gray-500">{{ eyebrow() }}</p>
    }
    <h2 [id]="headingId()" class="m-0 text-3xl font-extrabold tracking-tight text-secondary sm:text-4xl">
      {{ prefix() }} <span class="text-primary">{{ highlightedText() }}</span>
    </h2>
  </div>
</div>
